<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finger Mechanism Growth Tool</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; overflow: hidden; height: 100vh; }

.header { height: 44px; background: #fff; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #ddd; }
.header h1 { font-size: 15px; font-weight: 600; }
.header .status { margin-left: auto; font-size: 12px; color: #999; }
.header .status.error { color: #e04040; }
.btn { margin-left: 12px; padding: 4px 12px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; color: #666; cursor: pointer; }
.btn:hover { background: #f0f0f0; border-color: #999; }

.main { display: flex; height: calc(100vh - 44px - 28px); }

/* 左栏 */
.panel-tree { width: 260px; min-width: 260px; background: #fff; border-right: 1px solid #ddd; overflow-y: auto; padding: 12px; }
.panel-tree h2 { font-size: 13px; color: #999; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }

.tree ul { list-style: none; padding-left: 18px; }
.tree > ul { padding-left: 0; }
.tree li { position: relative; padding: 2px 0; }
.tree li::before { content: ''; position: absolute; left: -12px; top: 14px; width: 10px; height: 1px; background: #ddd; }
.tree li::after { content: ''; position: absolute; left: -12px; top: 0; width: 1px; height: 14px; background: #ddd; }
.tree li:last-child::after { height: 14px; }
.tree .node { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; padding: 4px 8px; border-radius: 4px; font-size: 13px; border: 2px solid transparent; transition: background 0.12s, border-color 0.12s; }
.tree .node:hover { background: #f0f0f0; }
.tree .node.selected { background: #e8f0fe; border-color: #4488ff; color: #1a56a0; }
.tree .icon { font-size: 10px; }
.tree .icon.frame { color: #4488ff; }
.tree .icon.point { color: #e07020; }
.tree .step-badge { font-size: 10px; background: #eef; color: #7799cc; padding: 1px 5px; border-radius: 3px; margin-left: 4px; }
.tree .relation { font-size: 11px; color: #999; margin-left: 22px; padding: 1px 0; }

/* 中栏 */
.viewport { flex: 1; position: relative; overflow: hidden; }
.viewport canvas { display: block; }
.viewport .label { position: absolute; color: #555; font-size: 11px; pointer-events: none; white-space: nowrap; font-weight: 500; }
.viewport .frame-label { position: absolute; color: #888; font-size: 10px; pointer-events: none; white-space: nowrap; font-style: italic; }

/* 右栏 */
.panel-params { width: 300px; min-width: 300px; background: #fff; border-left: 1px solid #ddd; overflow-y: auto; padding: 16px; }

.step-info { margin-bottom: 16px; }
.step-info .step-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.step-info .step-type { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
.step-info .step-relation { font-size: 13px; color: #555; margin-top: 8px; padding: 8px; background: #f8f8f8; border-radius: 4px; font-family: "SF Mono", Menlo, monospace; }

.param-group { margin-bottom: 16px; }
.param-group h3 { font-size: 13px; color: #999; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
.param-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.param-row label { font-size: 12px; min-width: 90px; color: #666; }
.param-row input[type="range"] { flex: 1; height: 4px; -webkit-appearance: none; background: #ddd; border-radius: 2px; outline: none; }
.param-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #4488ff; border-radius: 50%; cursor: pointer; }
.param-row .val { font-size: 12px; min-width: 56px; text-align: right; font-family: "SF Mono", Menlo, monospace; }

.auto-computed { margin-top: 16px; padding: 12px; background: #f0f8f0; border-radius: 4px; border: 1px solid #d0e8d0; }
.auto-computed h3 { font-size: 12px; color: #6a6; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.auto-computed .val-row { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
.auto-computed .val-row .v { font-family: "SF Mono", Menlo, monospace; color: #2a8a4a; }

.no-selection { color: #aaa; font-size: 13px; padding: 20px 0; text-align: center; }

.footer { height: 28px; background: #fff; border-top: 1px solid #ddd; display: flex; align-items: center; padding: 0 16px; font-size: 11px; color: #aaa; }

.loading-overlay { position: fixed; inset: 0; background: #f5f5f5; display: flex; align-items: center; justify-content: center; z-index: 999; }
.loading-overlay.hidden { display: none; }
</style>
</head>
<body>

<div class="loading-overlay" id="loading"><span>Loading...</span></div>

<div class="header">
    <h1>Finger Mechanism Growth Tool</h1>
    <button class="btn" id="btn-reset-cam">Reset View</button>
    <span class="status" id="status">Loading...</span>
</div>

<div class="main">
    <div class="panel-tree">
        <h2>Growth Tree</h2>
        <div class="tree" id="tree-container"></div>
    </div>
    <div class="viewport" id="viewport"></div>
    <div class="panel-params" id="panel-params">
        <p class="no-selection">Select a step to view its parameters</p>
    </div>
</div>

<div class="footer" id="footer">Initializing...</div>

<script type="module">
import * as THREE from '/static/lib/three.module.js';
import { OrbitControls } from '/static/lib/OrbitControls.js';

// ============================================================
// 全局状态
// ============================================================
let mechDef = null;
let currentParams = {};

let scene, camera, renderer, controls, raycaster, mouse;
const pointMeshes = {};
const lineObjects = {};
const circleObjects = {};
const labelDivs = {};
const frameAxes = {};
const frameLabelDivs = {};
const nodeSpans = {};

let selectedName = null;
const FADED_OPACITY = 0.08;

const FRAME_NAMES = ["base", "pivot", "platform", "servo_r", "servo_l"];
const DEFAULT_CAM_POS = [50, -60, 60];
const DEFAULT_CAM_TARGET = [10, 0, 20];
const SPHERE_SEG = 16;
const AXIS_LENGTH = 8;

// 帧到子点的映射
const frameChildPoints = {
    'world': [],
    'base': ['base'],
    'pivot': ['pivot'],
    'platform': ['arm', 'bar_upper', 'bar_lower'],
    'servo_r': ['servo_r', 'link_r'],
    'servo_l': ['servo_l', 'link_l'],
};

// 点到相关可视元素的映射
const pointToElements = {
    'base':      ['base_pivot_line'],
    'pivot':     ['base_pivot_line', 'pivot_arm_line', 'rot_axis'],
    'arm':       ['pivot_arm_line', 'bar_line'],
    'bar_upper': ['bar_line', 'link_right_line'],
    'bar_lower': ['bar_line', 'link_left_line'],
    'link_r':    ['link_right_line', 'servo_r_circle'],
    'link_l':    ['link_left_line', 'servo_l_circle'],
    'servo_r':   ['servo_r_circle'],
    'servo_l':   ['servo_l_circle'],
};

// ============================================================
// 初始化
// ============================================================
async function init() {
    try {
        const resp = await fetch('/api/mechanism/default');
        mechDef = await resp.json();
    } catch (err) {
        document.getElementById('status').textContent = 'Error: ' + err.message;
        return;
    }

    for (const [k, v] of Object.entries(mechDef.growth_params)) currentParams[k] = v.value;

    buildTree(mechDef.growth_tree, document.getElementById('tree-container'));
    initThreeJS();
    document.getElementById('btn-reset-cam').addEventListener('click', resetCamera);
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('status').textContent = 'Ready';
    document.getElementById('footer').textContent = 'Ready';
    updateScene(localCompute(currentParams));
    await doServerCompute();
}

// ============================================================
// 生长树
// ============================================================
function buildTree(node, container) {
    const ul = document.createElement('ul');
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.className = 'node';
    const ic = node.type === 'frame' ? 'frame' : 'point';
    span.innerHTML = `<span class="icon ${ic}">${node.type === 'frame' ? '■' : '●'}</span>`;
    span.appendChild(document.createTextNode(node.name));
    if (node.step) {
        const badge = document.createElement('span');
        badge.className = 'step-badge';
        badge.textContent = 'S' + node.step;
        span.appendChild(badge);
    }
    nodeSpans[node.name] = span;
    span.addEventListener('click', (e) => { e.stopPropagation(); selectNode(node.name); });

    li.appendChild(span);

    // 显示 relation
    if (node.relation) {
        const rel = document.createElement('div');
        rel.className = 'relation';
        rel.textContent = node.relation;
        li.appendChild(rel);
    }

    if (node.children) {
        for (const child of node.children) buildTree(child, li);
    }
    ul.appendChild(li);
    container.appendChild(ul);
}

// ============================================================
// 选中 / 高亮
// ============================================================
function getRelatedNames(name) {
    const names = new Set();
    const isFrame = FRAME_NAMES.includes(name);
    if (isFrame) {
        names.add(name);
        for (const p of (frameChildPoints[name] || [])) {
            names.add(p);
            for (const el of (pointToElements[p] || [])) names.add(el);
        }
    } else {
        names.add(name);
        for (const el of (pointToElements[name] || [])) names.add(el);
        for (const [fn, pts] of Object.entries(frameChildPoints)) {
            if (pts.includes(name)) names.add(fn);
        }
    }
    return names;
}

function selectNode(name) {
    if (selectedName === name) {
        selectedName = null;
        clearTreeSelection();
        setAllOpacity(1.0);
        renderParamsPanel(null);
        return;
    }
    selectedName = name;
    clearTreeSelection();
    const span = nodeSpans[name];
    if (span) span.classList.add('selected');
    applyHighlight(name);
    renderParamsPanel(name);
}

function clearTreeSelection() {
    document.querySelectorAll('.tree .node').forEach(n => n.classList.remove('selected'));
}

function applyHighlight(name) {
    const related = getRelatedNames(name);
    for (const [pname, mesh] of Object.entries(pointMeshes)) {
        if (pname.startsWith('_')) continue;
        setObjOpacity(mesh, related.has(pname) ? 1.0 : FADED_OPACITY);
    }
    for (const [eid, line] of Object.entries(lineObjects)) setObjOpacity(line, related.has(eid) ? 1.0 : FADED_OPACITY);
    for (const [eid, line] of Object.entries(circleObjects)) setObjOpacity(line, related.has(eid) ? 1.0 : FADED_OPACITY);
    for (const fname of FRAME_NAMES) {
        const fa = frameAxes[fname];
        if (!fa) continue;
        const op = related.has(fname) ? 1.0 : FADED_OPACITY;
        fa.arrows.forEach(a => { setObjOpacity(a.line, op); setObjOpacity(a.cone, op); });
    }
}

function setAllOpacity(op) {
    for (const [n, m] of Object.entries(pointMeshes)) { if (!n.startsWith('_')) setObjOpacity(m, op); }
    for (const l of Object.values(lineObjects)) setObjOpacity(l, op);
    for (const l of Object.values(circleObjects)) setObjOpacity(l, op);
    for (const fname of FRAME_NAMES) {
        const fa = frameAxes[fname];
        if (!fa) continue;
        fa.arrows.forEach(a => { setObjOpacity(a.line, op); setObjOpacity(a.cone, op); });
    }
}

function setObjOpacity(obj, op) {
    if (!obj || !obj.material) return;
    obj.material.transparent = op < 1.0;
    obj.material.opacity = op;
    if (obj.material.isLineDashedMaterial && op >= 1.0) obj.material.transparent = false;
}

// ============================================================
// 右面板：选中步骤的参数
// ============================================================
function renderParamsPanel(name) {
    const panel = document.getElementById('panel-params');
    if (!name) {
        panel.innerHTML = '<p class="no-selection">Select a step to view its parameters</p>';
        return;
    }

    // 找到树节点数据
    const treeNode = findTreeNode(mechDef.growth_tree, name);
    if (!treeNode) { panel.innerHTML = '<p class="no-selection">Unknown node</p>'; return; }

    let html = '<div class="step-info">';
    html += `<div class="step-title">${name}</div>`;
    html += `<div class="step-type">${treeNode.type === 'frame' ? 'Coordinate Frame' : 'Point'}</div>`;
    if (treeNode.step) html += `<div class="step-type" style="margin-top:2px">Step ${treeNode.step}</div>`;
    if (treeNode.relation) html += `<div class="step-relation">${treeNode.relation}</div>`;
    html += '</div>';

    // 该步骤的参数
    const paramNames = treeNode.params || [];
    if (paramNames.length > 0) {
        html += '<div class="param-group"><h3>Parameters</h3>';
        for (const pname of paramNames) {
            const spec = mechDef.growth_params[pname];
            if (!spec) continue;
            const val = currentParams[pname];
            const unitStr = spec.unit === 'deg' ? '°' : '';
            html += `<div class="param-row">
                <label>${spec.label}</label>
                <input type="range" min="${spec.min}" max="${spec.max}" step="1" value="${val}" data-param="${pname}">
                <span class="val" id="val-${pname}">${val}${unitStr}</span>
            </div>`;
        }
        html += '</div>';
    }

    // 自动计算的连杆长度
    html += `<div class="auto-computed">
        <h3>Auto-computed</h3>
        <div class="val-row"><span>link_right (bar_upper → link_r)</span><span class="v" id="ac-link-r">--</span></div>
        <div class="val-row"><span>link_left (bar_lower → link_l)</span><span class="v" id="ac-link-l">--</span></div>
    </div>`;

    panel.innerHTML = html;

    // input 拖动时本地预览，change 松手后后端计算
    panel.querySelectorAll('input[data-param]').forEach(inp => {
        inp.addEventListener('input', () => {
            const pname = inp.dataset.param;
            const v = parseFloat(inp.value);
            const spec = mechDef.growth_params[pname];
            const unitStr = spec.unit === 'deg' ? '°' : '';
            document.getElementById('val-' + pname).textContent = v + unitStr;
            currentParams[pname] = v;
            updateScene(localCompute(currentParams));
        });
        inp.addEventListener('change', () => {
            doServerCompute();
        });
    });

    // 更新连杆长度显示
    updateAutoComputed();
}

function findTreeNode(node, name) {
    if (node.name === name) return node;
    if (node.children) {
        for (const child of node.children) {
            const found = findTreeNode(child, name);
            if (found) return found;
        }
    }
    return null;
}

function updateAutoComputed() {
    const el1 = document.getElementById('ac-link-r');
    const el2 = document.getElementById('ac-link-l');
    if (!el1 || !el2) return;
    // 从 pointMeshes 算距离
    const bu = pointMeshes['bar_upper']?.position;
    const bl = pointMeshes['bar_lower']?.position;
    const lr = pointMeshes['link_r']?.position;
    const ll = pointMeshes['link_l']?.position;
    if (bu && lr) el1.textContent = bu.distanceTo(lr).toFixed(2) + ' mm';
    if (bl && ll) el2.textContent = bl.distanceTo(ll).toFixed(2) + ' mm';
}

// ============================================================
// Three.js
// ============================================================
function initThreeJS() {
    const box = document.getElementById('viewport');
    const w = box.clientWidth, h = box.clientHeight;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 5000);
    camera.position.set(...DEFAULT_CAM_POS);
    camera.up.set(0, 0, 1);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(window.devicePixelRatio);
    box.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(...DEFAULT_CAM_TARGET);
    controls.update();

    raycaster = new THREE.Raycaster();
    mouse = new THREE.Vector2();

    // 世界坐标轴
    const axLen = 25;
    addWorldAxis([0,0,0], [axLen,0,0], 0xee4444, 'X');
    addWorldAxis([0,0,0], [0,axLen,0], 0x44bb44, 'Y');
    addWorldAxis([0,0,0], [0,0,axLen], 0x4488ee, 'Z');

    const grid = new THREE.GridHelper(100, 20, 0xe0e0e0, 0xefefef);
    grid.rotation.x = Math.PI / 2;
    scene.add(grid);

    for (const el of mechDef.visualization) createEl(el);
    for (const fname of mechDef.frame_names) createFrameAxes(fname);

    renderer.domElement.addEventListener('click', onCanvasClick);
    window.addEventListener('resize', onResize);
    animate();
}

function addWorldAxis(a, b, color, label) {
    const geom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a), new THREE.Vector3(...b)]);
    scene.add(new THREE.Line(geom, new THREE.LineBasicMaterial({ color })));
    const div = document.createElement('div');
    div.className = 'frame-label';
    div.textContent = label;
    div.style.color = '#' + color.toString(16).padStart(6, '0');
    document.getElementById('viewport').appendChild(div);
    labelDivs['_world_' + label] = div;
    pointMeshes['_world_' + label] = { position: new THREE.Vector3(...b) };
}

function createFrameAxes(name) {
    const group = new THREE.Group();
    const colors = [0xee4444, 0x44bb44, 0x4488ee];
    const dirs = [new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1)];
    const arrows = dirs.map((dir, i) => {
        const arrow = new THREE.ArrowHelper(dir, new THREE.Vector3(0,0,0), AXIS_LENGTH, colors[i], 2, 1.2);
        arrow.line.material.transparent = true; arrow.line.material.opacity = 1.0;
        arrow.cone.material.transparent = true; arrow.cone.material.opacity = 1.0;
        group.add(arrow);
        return arrow;
    });
    scene.add(group);

    const div = document.createElement('div');
    div.className = 'frame-label';
    div.textContent = name;
    document.getElementById('viewport').appendChild(div);
    frameLabelDivs[name] = div;
    frameAxes[name] = { group, arrows };
}

function createEl(el) {
    if (el.type === 'sphere') {
        const geom = new THREE.SphereGeometry(el.radius, SPHERE_SEG, SPHERE_SEG);
        const mat = new THREE.MeshBasicMaterial({ color: el.color, transparent: true, opacity: 1.0, depthWrite: true });
        const mesh = new THREE.Mesh(geom, mat);
        scene.add(mesh);
        pointMeshes[el.point] = mesh;
        if (el.label) {
            const div = document.createElement('div');
            div.className = 'label';
            div.textContent = el.label;
            document.getElementById('viewport').appendChild(div);
            labelDivs[el.point] = div;
        }
    }
    else if (el.type === 'line') {
        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
        let mat;
        if (el.dash) mat = new THREE.LineDashedMaterial({ color: el.color, transparent: true, opacity: 1.0, dashSize: 2, gapSize: 1.5 });
        else mat = new THREE.LineBasicMaterial({ color: el.color, transparent: true, opacity: 1.0 });
        const line = new THREE.Line(geom, mat);
        if (el.dash) line.computeLineDistances();
        scene.add(line);
        lineObjects[el.id] = line;
    }
    else if (el.type === 'circle') {
        const seg = 64;
        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array((seg+1)*3), 3));
        const mat = el.dash
            ? new THREE.LineDashedMaterial({ color: el.color, transparent: true, opacity: 1.0, dashSize: 2, gapSize: 1.5 })
            : new THREE.LineBasicMaterial({ color: el.color, transparent: true, opacity: 1.0 });
        const line = new THREE.Line(geom, mat);
        scene.add(line);
        circleObjects[el.id] = line;
    }
}

function onCanvasClick(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const meshes = Object.entries(pointMeshes).filter(([n]) => !n.startsWith('_')).map(([,m]) => m);
    const hits = raycaster.intersectObjects(meshes);
    if (hits.length === 0) return;
    const hitName = Object.entries(pointMeshes).find(([,m]) => m === hits[0].object)?.[0];
    if (hitName) selectNode(hitName);
}

// ============================================================
// 场景更新
// ============================================================
function updateScene(data) {
    const pts = data.points;
    for (const [name, mesh] of Object.entries(pointMeshes)) {
        if (pts[name] && mesh.position && mesh.position.set) mesh.position.set(...pts[name]);
    }
    for (const el of mechDef.visualization) {
        if (el.type === 'line') {
            const line = lineObjects[el.id];
            if (!line || !pts[el.from] || !pts[el.to]) continue;
            const p = line.geometry.attributes.position.array;
            p[0]=pts[el.from][0]; p[1]=pts[el.from][1]; p[2]=pts[el.from][2];
            p[3]=pts[el.to][0];   p[4]=pts[el.to][1];   p[5]=pts[el.to][2];
            line.geometry.attributes.position.needsUpdate = true;
            if (el.dash) line.computeLineDistances();
        }
        else if (el.type === 'circle') {
            const line = circleObjects[el.id];
            const c = pts[el.center]; const r = currentParams[el.radius_param] || 16;
            if (!line || !c) continue;
            const p = line.geometry.attributes.position.array;
            const n = (p.length / 3) - 1;
            for (let i = 0; i <= n; i++) {
                const a = (i / n) * Math.PI * 2; const j = i * 3;
                p[j]=c[0]; p[j+1]=c[1]+r*Math.cos(a); p[j+2]=c[2]+r*Math.sin(a);
            }
            line.geometry.attributes.position.needsUpdate = true;
            if (el.dash) line.computeLineDistances();
        }
    }
    const frames = data.frames || {};
    for (const fname of mechDef.frame_names) {
        const fa = frameAxes[fname]; const fd = frames[fname];
        if (!fa || !fd) continue;
        fa.group.position.set(...fd.origin);
        const axes = fd.axes;
        [new THREE.Vector3(...axes[0]).normalize(),
         new THREE.Vector3(...axes[1]).normalize(),
         new THREE.Vector3(...axes[2]).normalize()
        ].forEach((dir, i) => {
            fa.arrows[i].setDirection(dir);
            fa.arrows[i].setLength(AXIS_LENGTH, 2, 1.2);
        });
    }
    updateLabels();
    updateAutoComputed();
    if (selectedName) applyHighlight(selectedName);
}

function updateLabels() {
    const rect = renderer.domElement.getBoundingClientRect();
    for (const [name, div] of Object.entries(labelDivs)) {
        const mesh = pointMeshes[name];
        if (!mesh || !mesh.position || !mesh.position.clone) continue;
        const v = mesh.position.clone().project(camera);
        div.style.left = ((v.x * 0.5 + 0.5) * rect.width + 8) + 'px';
        div.style.top = ((-v.y * 0.5 + 0.5) * rect.height - 6) + 'px';
        div.style.display = v.z < 1 ? '' : 'none';
    }
    for (const fname of mechDef.frame_names) {
        const fa = frameAxes[fname]; const div = frameLabelDivs[fname];
        if (!fa || !div) continue;
        const v = fa.group.position.clone().project(camera);
        div.style.left = ((v.x * 0.5 + 0.5) * rect.width + 12) + 'px';
        div.style.top = ((-v.y * 0.5 + 0.5) * rect.height + 2) + 'px';
        div.style.display = v.z < 1 ? '' : 'none';
    }
}

// ============================================================
// 本地计算（Python compute 的 JS 镜像，用于滑块拖动时的即时预览）
// ============================================================
function localCompute(params) {
    const deg = Math.PI / 180;
    const z0 = params.z0, L_cp = params.L_cp, L_A = params.L_A, L_B = params.L_B;
    const theta = params.theta * deg, alpha = params.alpha * deg;
    const x_e = params.x_e, y_e = params.y_e, z_e = params.z_e;
    const R = params.R, beta1 = params.beta1 * deg, beta2 = params.beta2 * deg;

    const base_pos = [0, 0, z0];
    const pivot_pos = [L_cp, 0, z0];

    const ct = Math.cos(theta), st = Math.sin(theta);
    const xA = L_A * Math.sin(alpha), zA = L_A * Math.cos(alpha);

    const mul = (m, v) => [m[0]*v[0]+m[1]*v[1]+m[2]*v[2], m[3]*v[0]+m[4]*v[1]+m[5]*v[2], m[6]*v[0]+m[7]*v[1]+m[8]*v[2]];
    const add = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]];
    const Rx = [1,0,0, 0,ct,-st, 0,st,ct];

    const arm_local = [xA, 0, zA];
    const bar_upper_local = [xA, L_B/2, zA];
    const bar_lower_local = [xA, -L_B/2, zA];

    const arm_world = add(pivot_pos, mul(Rx, arm_local));
    const bar_upper_world = add(pivot_pos, mul(Rx, bar_upper_local));
    const bar_lower_world = add(pivot_pos, mul(Rx, bar_lower_local));

    const servo_r_pos = [x_e, y_e, z_e];
    const servo_l_pos = [x_e, -y_e, z_e];
    const link_r_pos = add(servo_r_pos, [0, R*Math.cos(beta1), R*Math.sin(beta1)]);
    const link_l_pos = add(servo_l_pos, [0, R*Math.cos(beta2), R*Math.sin(beta2)]);

    const axis_half = 25;
    const rot_axis_start = add(pivot_pos, [-axis_half, 0, 0]);
    const rot_axis_end = add(pivot_pos, [axis_half, 0, 0]);

    const dist = (a, b) => Math.sqrt((a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2);
    const I3 = [[1,0,0],[0,1,0],[0,0,1]];
    // Rx transposed
    const RxT = [1,0,0, 0,ct,st, 0,-st,ct];
    const axesMat = (m) => [[m[0],m[1],m[2]],[m[3],m[4],m[5]],[m[6],m[7],m[8]]];

    return {
        points: {
            origin: [0,0,0], base: base_pos, pivot: pivot_pos,
            arm: arm_world, bar_upper: bar_upper_world, bar_lower: bar_lower_world,
            servo_r: servo_r_pos, servo_l: servo_l_pos,
            link_r: link_r_pos, link_l: link_l_pos,
            rot_axis_start, rot_axis_end,
        },
        frames: {
            world: { origin: [0,0,0], axes: I3 },
            base: { origin: base_pos, axes: I3 },
            pivot: { origin: pivot_pos, axes: I3 },
            platform: { origin: pivot_pos, axes: axesMat(RxT) },
            servo_r: { origin: servo_r_pos, axes: I3 },
            servo_l: { origin: servo_l_pos, axes: I3 },
        },
        link_lengths: {
            right: Math.round(dist(bar_upper_world, link_r_pos) * 10000) / 10000,
            left: Math.round(dist(bar_lower_world, link_l_pos) * 10000) / 10000,
        },
    };
}

// ============================================================
// 后端计算（滑块松手后调用）
// ============================================================
async function doServerCompute() {
    document.getElementById('status').textContent = 'Computing...';
    try {
        const resp = await fetch('/api/compute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ params: currentParams }),
        });
        const data = await resp.json();
        updateScene(data);
        document.getElementById('status').textContent = 'Ready';
    } catch (err) {
        document.getElementById('status').textContent = 'Error: ' + err.message;
        document.getElementById('status').classList.add('error');
    }
}

// ============================================================
// 渲染循环 & 辅助
// ============================================================
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    updateLabels();
    renderer.render(scene, camera);
}

function resetCamera() {
    camera.position.set(...DEFAULT_CAM_POS);
    camera.up.set(0, 0, 1);
    controls.target.set(...DEFAULT_CAM_TARGET);
    controls.update();
}

function onResize() {
    const box = document.getElementById('viewport');
    camera.aspect = box.clientWidth / box.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(box.clientWidth, box.clientHeight);
}

init();
</script>
