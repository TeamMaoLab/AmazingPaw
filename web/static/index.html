<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finger Mechanism Growth Tool</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="loading-overlay" id="loading"><span>Loading...</span></div>

<div class="header">
    <h1>Finger Mechanism Growth Tool</h1>
    <button class="btn" id="btn-reset-cam">Reset View</button>
    <span class="status" id="status">Loading...</span>
</div>

<div class="main">
    <div class="panel-tree">
        <h2>Growth Tree</h2>
        <div class="tree" id="tree-container"></div>
    </div>
    <div class="viewport" id="viewport">
        <div class="view-btns">
            <button data-view="+X" title="View +X">+X</button>
            <button data-view="-X" title="View -X">-X</button>
            <button data-view="+Y" class="sep" title="View +Y">+Y</button>
            <button data-view="-Y" title="View -Y">-Y</button>
            <button data-view="+Z" class="sep" title="View +Z">+Z</button>
            <button data-view="-Z" title="View -Z">-Z</button>
        </div>
    </div>
    <div class="panel-params" id="panel-params">
        <p class="no-selection">Select a step to view its parameters</p>
    </div>
</div>

<div class="footer" id="footer">Initializing...</div>

<script type="module" src="/static/main.js"></script>
</body>
</html>
