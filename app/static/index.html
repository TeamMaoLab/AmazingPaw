<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parametric Skeleton Sketch</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
</head>
<body>
<div class="header">
  <h1>Parametric Skeleton</h1>
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="design">Design</button>
    <button class="mode-tab" data-mode="grid">Grid</button>
    <button class="mode-tab" data-mode="ik">IK</button>
    <button class="mode-tab" data-mode="track">Track</button>
    <button id="save-params-btn" class="mode-tab" style="margin-left:12px;background:#2ecc71;color:#fff;border-color:#27ae60;">Save Params</button>
  </div>
  <span class="status" id="status">Ready</span>
</div>
<div class="main">
  <div class="viewport" id="viewport">
    <div class="view-btns">
      <button data-view="home" title="Reset View">&#8962;</button>
      <button data-view="+X" class="sep">+X</button>
      <button data-view="-X">-X</button>
      <button data-view="+Y" class="sep">+Y</button>
      <button data-view="-Y">-Y</button>
      <button data-view="+Z" class="sep">+Z</button>
      <button data-view="-Z">-Z</button>
      <button id="dim-toggle" class="sep active" title="Toggle Annotations">DIM</button>
      <button id="math-toggle" class="sep" title="Math Model">MATH</button>
    </div>
    <div class="growth-tree" id="growth-tree"></div>

    <!-- Grid mode panel -->
    <div class="grid-panel hidden" id="grid-panel">
      <div class="grid-header">
        <span class="grid-title">β₁ × β₂ Workspace</span>
        <span class="grid-status" id="grid-status">Ready</span>
      </div>
      <div class="grid-controls">
        <label>Range <input type="number" id="grid-from" value="0" min="0" max="180" step="1" style="width:36px">° – <input type="number" id="grid-to" value="180" min="0" max="180" step="1" style="width:36px">°</label>
        <label>Step <input type="number" id="grid-step" value="1" min="0.5" max="10" step="0.5" style="width:42px">°</label>
        <button id="grid-recompute">Compute</button>
      </div>
      <canvas id="grid-canvas" width="320" height="320"></canvas>
      <div class="grid-footer" id="grid-footer">Click to explore</div>
    </div>

    <!-- IK mode panel -->
    <div class="ik-panel hidden" id="ik-panel">
      <div class="ik-header">
        <span class="ik-title">Inverse Kinematics (Grid Search)</span>
        <span class="ik-status" id="ik-status">Drag the pink sphere</span>
      </div>
      <div class="ik-body">
        <div class="ik-row"><span class="ik-label">Target</span><span class="ik-value" id="ik-target">—</span></div>
        <div class="ik-row"><span class="ik-label">β₁</span><span class="ik-value" id="ik-beta1">—</span></div>
        <div class="ik-row"><span class="ik-label">β₂</span><span class="ik-value" id="ik-beta2">—</span></div>
        <div class="ik-row"><span class="ik-label">Error</span><span class="ik-value" id="ik-error">—</span></div>
      </div>
    </div>

    <!-- Track mode panel -->
    <div class="track-panel hidden" id="track-panel">
      <div class="track-header">
        <span class="track-title">Hand Tracking</span>
        <span class="track-status" id="track-status">--</span>
      </div>
      <div class="track-body">
        <div class="track-row"><span class="track-label">Hand</span><span class="track-value" id="track-hand">--</span></div>
        <div class="track-row"><span class="track-label">FPS</span><span class="track-value" id="track-fps">--</span></div>
        <div class="track-row"><span class="track-label">β₁</span><span class="track-value" id="track-beta1">--</span></div>
        <div class="track-row"><span class="track-label">β₂</span><span class="track-value" id="track-beta2">--</span></div>
      </div>
    </div>
  </div>
  <div class="math-drawer" id="math-drawer">
    <div class="math-drawer-inner" id="math-drawer-content"></div>
  </div>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
